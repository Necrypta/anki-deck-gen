# Test builds: every pull request (and main) gets a portable .exe to try out.
# On PRs, a comment with the download link is posted and kept up to date.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out build label
        id: label
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $sha = "${{ github.event.pull_request.head.sha }}".Substring(0, 7)
            $n = "${{ github.event.pull_request.number }}"
            "label=PR #$n · $sha" >> $env:GITHUB_OUTPUT
            "artifact=AnkiDeckGenerator-pr$n-$sha" >> $env:GITHUB_OUTPUT
          } else {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $ref = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
            "label=$ref · $sha" >> $env:GITHUB_OUTPUT
            "artifact=AnkiDeckGenerator-$ref-$sha" >> $env:GITHUB_OUTPUT
          }

      - uses: ./.github/actions/build-app
        with:
          label: ${{ steps.label.outputs.label }}

      - name: Upload test build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/AnkiDeckGenerator.exe
            dist/ai-bakeoff.exe
          retention-days: 30

      - name: Post download link on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          LABEL: ${{ steps.label.outputs.label }}
        with:
          script: |
            const marker = "<!-- test-build -->";
            const body = [
              marker,
              `### Test build ready: ${process.env.LABEL}`,
              ``,
              `**[Download the test build](${process.env.ARTIFACT_URL})** (zip, kept 30 days): \`AnkiDeckGenerator.exe\`, plus \`ai-bakeoff.exe\` for comparing local AI models (see the README).`,
              ``,
              `Unzip and run it; no install needed. It saves to \`%APPDATA%\\AnkiDeckGenerator-test\`, so your installed copy's data is untouched.`,
              `If Windows SmartScreen warns, choose **More info → Run anyway**.`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
