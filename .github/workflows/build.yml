name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Test backend
        run: pytest -q

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build exe
        run: pyinstaller --noconfirm --clean ankigen.spec

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiDeckGenerator-windows
          path: dist/AnkiDeckGenerator.exe
